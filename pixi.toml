[workspace]
name = "mojoui"
version = "0.1.0-alpha"
description = "Modern Mojo immediate-mode GUI library with retained node graph"
authors = ["Alex"]
channels = ["https://conda.modular.com/max-nightly", "conda-forge"]
platforms = ["linux-64"]

[dependencies]
modular = ">=26.1.0.dev2025122205,<27"
imagemagick = ">=7.1.2_24,<8"

[tasks]
build-c = "make -C c_floor"
build = { depends-on = ["build-c"] }
clean = "make -C c_floor clean"
# LD_LIBRARY_PATH=. so the dynamic linker finds libmojoui_floor.so in the
# project root (where the C-floor Makefile drops it). Tasks invoked via
# `pixi run <name>` execute from this pixi.toml's directory.
hello = "LD_LIBRARY_PATH=. mojo run -I . examples/m0_hello.mojo"
# M1 demo built to a real binary (NOT `mojo run` / JIT) so libmojoui_floor.so
# can be linked at compile time. The JIT path materialises every reachable
# `external_call` symbol eagerly and trips "Symbols not found" on the gated
# Backend dispatch — building once produces a real executable that respects
# the runtime-False gate properly. The build step is fast (<5s) and the
# resulting binary lives under /tmp.
m1 = { cmd = "mojo build -I . -Xlinker -L. -Xlinker -lmojoui_floor examples/m1_button.mojo -o /tmp/mojoui_m1_demo && LD_LIBRARY_PATH=. /tmp/mojoui_m1_demo", depends-on = ["build-c"] }
# M2 capstone gallery — same build-then-run shape as m1 because
# text_edit/text_area/combobox internally reach FFI symbols
# (mojoui_get_input_text, mojoui_input_text_length, mojoui_get_key) that
# `mojo run` (JIT) cannot resolve under the static call graph. Building
# against libmojoui_floor.so via `-Xlinker -L. -Xlinker -lmojoui_floor`
# links the symbols at compile time; the gallery never actually runs
# them (no GL context, no live input poll).
gallery = { cmd = "mojo build -I . -Xlinker -L. -Xlinker -lmojoui_floor -Xlinker -lm examples/m2_widgets_gallery.mojo -o /tmp/mojoui_m2_gallery && LD_LIBRARY_PATH=. /tmp/mojoui_m2_gallery", depends-on = ["build-c"] }
# M2.5 capstone — node graph + serde round-trip demo. Same build-then-run
# shape as `gallery`: the canvas widget reads `ctx.input.mouse_held`/
# `mouse_released` whose FFI symbols (`mojoui_get_mouse_*`) the JIT
# resolves eagerly through the static call graph. Building against
# libmojoui_floor.so links the symbols at compile time; the runtime gate
# never fires (begin_frame_no_input keeps them unreached at runtime).
nodes = { cmd = "mojo build -I . -Xlinker -L. -Xlinker -lmojoui_floor examples/m2_5_node_graph.mojo -o /tmp/mojoui_nodes_demo && LD_LIBRARY_PATH=. /tmp/mojoui_nodes_demo", depends-on = ["build-c"] }
# M3 capstone — themed gallery showcase. Same build-then-run shape as the
# other capstones: the tessellator's tess_* helpers reach Backend.draw_batch
# which the JIT resolves eagerly through the static call graph. Building
# against libmojoui_floor.so links the symbols at compile time; no live
# window is opened (no Backend.run_blocking call) so the runtime visual gate
# remains deferred per Mojo implementation notes.
themed = { cmd = "mojo build -I . -Xlinker -L. -Xlinker -lmojoui_floor -Xlinker -lm examples/m3_themed_gallery.mojo -o /tmp/mojoui_m3_themed", depends-on = ["build-c"] }
# c53 — FIRST INTERACTIVE DEMO. Opens a real window with mouse + keyboard
# input + persistent state across frames using the c50 user_data extension.
# Click theme-switcher buttons to swap palettes live, click the counter
# button to increment a persistent Int32, drag the slider to set a Float32.
# Build-then-run shape so the FFI symbols (`mojoui_set_user_data`,
# `mojoui_get_user_data`, `mojoui_draw_batch`) resolve at link time
# (JIT can't dlopen them); extra `-Xlinker -lm` per the c49 finding because
# the tessellator's sin/cos calls link against `sincosf` from libm.
interactive = { cmd = "mojo build -I . -Xlinker -L. -Xlinker -lmojoui_floor -Xlinker -lm examples/m3_interactive_demo.mojo -o /tmp/mojoui_interactive && LD_LIBRARY_PATH=. /tmp/mojoui_interactive", depends-on = ["build-c"] }
# m4 — live kitchen-sink: every widget (checkbox/radio/slider/drag_value/
# progress_bar/text_edit/text_area/combobox/collapsing_header/separator)
# in one real window. Build-then-run for the same reasons as `interactive`.
kitchen = { cmd = "mojo build -I . -Xlinker -L. -Xlinker -lmojoui_floor -Xlinker -lm examples/m4_kitchen_sink.mojo -o /tmp/mojoui_m4_kitchen && LD_LIBRARY_PATH=. /tmp/mojoui_m4_kitchen", depends-on = ["build-c"] }
# m5 — live menu-system demo: top menubar (File/Edit/Help), right-click
# context menu on the canvas, status line. Build-then-run for the same
# reasons as `kitchen` (FFI symbols the JIT can't dlopen).
menus = { cmd = "mojo build -I . -Xlinker -L. -Xlinker -lmojoui_floor -Xlinker -lm examples/m5_menus.mojo -o /tmp/mojoui_m5_menus && LD_LIBRARY_PATH=. /tmp/mojoui_m5_menus", depends-on = ["build-c"] }

# m6 — interactive node-graph: drag/pan, node + add context menus, wire
# select+delete, per-node field bodies, progress badges, inline rename.
# Build-then-run (FFI input + text_edit symbols the JIT can't dlopen).
nodegraph = { cmd = "mojo build -I . -Xlinker -L. -Xlinker -lmojoui_floor -Xlinker -lm examples/m6_nodegraph.mojo -o /tmp/mojoui_m6_nodegraph && LD_LIBRARY_PATH=. /tmp/mojoui_m6_nodegraph", depends-on = ["build-c"] }

# m7 — advanced widgets: tab bar switching between tree view + data table.
widgets = { cmd = "mojo build -I . -Xlinker -L. -Xlinker -lmojoui_floor -Xlinker -lm examples/m7_widgets.mojo -o /tmp/mojoui_m7_widgets && LD_LIBRARY_PATH=. /tmp/mojoui_m7_widgets", depends-on = ["build-c"] }
# c54 — serenitymojo UI stub (M4 preview). Static single-frame demo showing
# the EXACT UI shape serenitymojo's app will use once M4 integration lands
# (title bar + theme switcher + model picker + positive/negative prompts +
# sampler controls + Generate button + progress bar + image preview rect).
# Same build-then-run shape as `themed`: text_area + combobox reach FFI
# symbols AND the preview helper calls `tess_rounded_rect` which reaches
# `mojoui_draw_batch`; building against libmojoui_floor.so + libm resolves
# all of them at link time. No live window — runtime visual gate deferred.
serenity_ui = { cmd = "mojo build -I . -Xlinker -L. -Xlinker -lmojoui_floor -Xlinker -lm examples/serenity_ui_stub.mojo -o /tmp/mojoui_serenity_ui && LD_LIBRARY_PATH=. /tmp/mojoui_serenity_ui", depends-on = ["build-c"] }
# m8 — M4 interactive inference UI. 3-column text->image app
# mirroring inference_ui: left params (collapsing headers), center canvas
# (prompt/negative text_area + Generate/Cancel + synthetic gradient preview +
# progress), right queue/history + mock perf footer. Build-then-run shape like
# nodegraph/widgets: text_area/combobox + tess_rounded_rect reach FFI symbols
# the JIT can't dlopen; +lm for the tessellator's sincosf.
inference = { cmd = "mojo build -I . -Xlinker -L. -Xlinker -lmojoui_floor -Xlinker -lm examples/m8_inference_ui.mojo -o /tmp/mojoui_m8_inference && LD_LIBRARY_PATH=. /tmp/mojoui_m8_inference", depends-on = ["build-c"] }
# m9 — native trainer UI shell. Trainer-first app based on the Rust Trainer
# handoff, wired to the CPU-only trainer runtime bridge.
trainer = { cmd = "mojo build -I . -Xlinker -L. -Xlinker -lmojoui_floor -Xlinker -lm examples/m9_trainer_ui.mojo -o /tmp/mojoui_m9_trainer && LD_LIBRARY_PATH=. /tmp/mojoui_m9_trainer", depends-on = ["build-c"] }
