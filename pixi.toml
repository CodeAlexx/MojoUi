# text_edit drives consume_text() which reaches FFI symbols the JIT can't
# dlopen, so this test is build-then-run (links libmojoui_floor.so) rather
# than `mojo run`. It stays headless — disable_ffi_text() + staged
# pending_text mean no C-floor / GL context is touched.
test-text-edit = { cmd = "mojo build -I . -Xlinker -L. -Xlinker -lmojoui_floor -Xlinker -lm tests/widgets/test_text_edit.mojo -o /tmp/mojoui_test_te && LD_LIBRARY_PATH=. /tmp/mojoui_test_te", depends-on = ["build-c"] }
